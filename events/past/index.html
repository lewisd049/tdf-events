<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Past Events — TDF Events</title>

  <link
    rel="stylesheet"
    href="../../assets/css/style.css"
  >
</head>

<body>

  <header class="site-header">

    <a class="brand" href="/">
      <img
        src="../../assets/images/tdf-logo.png"
        alt="TDF Diamond Family"
      >

      <span>Events</span>
    </a>


    <nav>

      <a href="/events/">
        Events
      </a>

      <a href="/account/">
        My account
      </a>

    </nav>

  </header>


  <main class="page">

    <div class="page-intro">

      <!-- This button is intentionally always available -->
      <p>
        <a
          class="small-button"
          href="/events/"
        >
          ← Upcoming Events
        </a>
      </p>


      <p class="eyebrow">
        ARCHIVE
      </p>


      <h1>
        Past<br>
        <em>events.</em>
      </h1>


      <p>
        Take a look back at events that have already finished.
      </p>

    </div>


    <div
      id="past-event-list"
      class="event-grid"
    >
      <div class="loading">
        Finding past events…
      </div>
    </div>

  </main>


  <footer>
    © <span id="year"></span> TDF Events
  </footer>


  <script
    type="module"
    src="../../assets/js/past-events.js"
  ></script>

</body>
</html>
